# Beanscape staging world on VM 123 (OpenRune). Copy to game.yml on the VM; secrets stay there.
# Runs next to the live revision 233 server, so it uses its own port and world id. The client
# connects to 40000 + world (40002): staging's jav_config sets param 15 (build) to 1.
name: "Beanscape Staging"
game-port: 40002
revision: 242
environment: "LIVE"
world: 2

world-types: ["main"]

gameplay:
  # Quests count as completed for requirement checks (replaces ::questsdone for gating).
  quest-requirements:
    mode: assume-completed
  farming-growth-rate: 1
  drop-rates:
    multiplier: 1.0
  level-up-popups: false
  idle-logout: true
  home-teleport-cooldown: 30
  random-events: true
  bots-enabled: true

# Central runs as its own service on the VM (plan decision D2). The two SET_ON_VM values are filled
# in from /opt/osrs/openrune/secrets.env by deploy/staging/deploy-staging.sh; never commit them.
central:
  same-instance: false
  host: "127.0.0.1"
  link-port: 9091
  world-key: "SET_ON_VM"
  postgres:
    jdbc-url: "jdbc:postgresql://127.0.0.1:5432/openrune_central"
    user: "openrune"
    password: "SET_ON_VM"
    pool-size: 10

# Log Central world-link auth timings and failures (staging diagnostics).
login-timing-logs: true
